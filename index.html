:root{
  --red:#CC0000; --bg:#050505; --bg2:#0a0a0a; --white:#fff; --grey:#8a8a8a;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:var(--bg);color:var(--white);font-family:'Helvetica Neue',Arial,sans-serif;overflow-x:hidden;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* LOADER */
#loader{position:fixed;inset:0;background:#000;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s ease, visibility .8s;}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
.load-brand{font-size:15px;letter-spacing:6px;color:var(--white);opacity:0;animation:fadeIn .6s .1s forwards;}
.load-sub{font-size:12px;letter-spacing:4px;color:var(--grey);opacity:0;animation:fadeIn .6s .5s forwards;}
.load-bar{width:220px;height:1px;background:#1c1c1c;position:relative;margin-top:10px;}
.load-bar span{position:absolute;left:0;top:0;height:100%;background:var(--red);width:0%;animation:loadBar 2.1s ease-in-out forwards;box-shadow:0 0 8px var(--red);}
@keyframes loadBar{to{width:100%;}}
@keyframes fadeIn{to{opacity:1;}}

/* NAV */
header{position:fixed;top:0;left:0;right:0;z-index:60;padding:20px 4vw;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;justify-content:flex-start;align-items:flex-start;mix-blend-mode:normal;pointer-events:none;}
.logo{display:block;width:300px;height:auto;max-width:none;margin:0;padding:0;line-height:0;text-decoration:none;cursor:pointer;position:relative;z-index:100;pointer-events:auto;overflow:visible;transition:transform .3s ease,opacity .3s ease;}
.logo img{display:block;width:100%;height:auto;max-width:none;max-height:none;object-fit:contain;object-position:left top;margin:0;padding:0;border:0;}
.logo:hover{transform:scale(1.025);opacity:.9;}
.logo:active{transform:scale(.98);}
.logo:focus-visible{outline:2px solid var(--red);outline-offset:6px;}
.nav-tag{font-size:11px;letter-spacing:3px;color:var(--grey);}

section{position:relative;padding:140px 6vw;max-width:1400px;margin:0 auto;}

/* HERO */
.hero{min-height:100vh;padding-top:calc(120px + env(safe-area-inset-top,0px));display:flex;align-items:center;position:relative;max-width:none;overflow:hidden;}

/* HERO BACKGROUND SLIDESHOW */
.hero{isolation:isolate;background:#050505;}
.hero-bg-slideshow{position:absolute;inset:0;z-index:0;overflow:hidden;background:#050505;}
.hero-bg-slide{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:center;opacity:0;filter:saturate(.82) contrast(1.06) brightness(.55);transform:scale(1.035);will-change:opacity,transform;animation:heroImageSlide 32.5s cubic-bezier(.22,.61,.36,1) infinite;}
.hero-bg-slide:nth-child(1){animation-delay:0s;}
.hero-bg-slide:nth-child(2){animation-delay:6.5s;}
.hero-bg-slide:nth-child(3){animation-delay:13s;}
.hero-bg-slide:nth-child(4){animation-delay:19.5s;}
.hero-bg-slide:nth-child(5){animation-delay:26s;}
.hero-bg-vignette{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.3) 100%,
      rgba(0,0,0,.5) 100%,
      rgba(0,0,0,.08) 100%
    );
}
.hero-bg-grain{position:absolute;inset:0;z-index:2;opacity:.045;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");}
@keyframes heroImageSlide{0%{opacity:0;transform:scale(1.035) translate3d(0,0,0)}4%{opacity:1}18%{opacity:1;transform:scale(1.085) translate3d(-.8%, -.35%,0)}22%{opacity:0;transform:scale(1.095) translate3d(-1.1%, -.5%,0)}100%{opacity:0;transform:scale(1.095) translate3d(-1.1%, -.5%,0)}}
.hero-inner,.hero .globe-wrap{z-index:3;}
@media(max-width:900px){
  .hero{min-height:100svh;padding-top:calc(120px + env(safe-area-inset-top,0px));}
  .hero-bg-slide{object-position:center;filter:saturate(.78) contrast(1.05) brightness(.48);}
  .hero-bg-vignette{background:linear-gradient(90deg,rgba(0,0,0,.84),rgba(0,0,0,.58)),linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.18) 48%,rgba(0,0,0,.78));}
}
@media(prefers-reduced-motion:reduce){.hero-bg-slide{animation:none;opacity:0;}.hero-bg-slide:first-child{opacity:1;transform:none;}}
.hero-inner{position:relative;z-index:3;width:58%;max-width:1000px;}
.eyebrow{font-size:12px;letter-spacing:5px;color:var(--red);margin-bottom:28px;}
.hero h1{font-family:'SFSportsNight',Arial,sans-serif;font-weight:400;font-size:clamp(52px,8.5vw,125px);line-height:.88;letter-spacing:-1px;text-transform:uppercase;max-width:950px;}
.hero h1 .line{display:block;overflow:visible;height:auto;line-height:.88;}
.hero h1 .line span{display:inline-block;transform:translateY(110%);animation:riseIn .9s cubic-bezier(.22,1,.36,1) forwards;}
.hero h1 .line:nth-child(1) span{animation-delay:2.5s;}
.hero h1 .line:nth-child(2) span{animation-delay:2.65s;}
.hero h1 .line:nth-child(3) span{animation-delay:2.8s;color:var(--red);}
@keyframes riseIn{to{transform:translateY(0);}}
.hero-tag{font-size:clamp(14px,1.6vw,30px);color:var(--white);margin-top:34px;letter-spacing:0.1px;max-width:640px;opacity:0;animation:fadeUp .8s 3.1s forwards;}
.hero-JJ{font-size:clamp(14px,1.6vw,20px);color:var(--white);margin-top:5px;letter-spacing:1px;max-width:640px;opacity:0;animation:fadeUp .8s 3.1s forwards;}
.hero-copy{font-size:15px;color:var(--grey);margin-top:18px;max-width:480px;line-height:1.7;opacity:0;animation:fadeUp .8s 3.25s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.cta-row{display:flex;gap:18px;margin-top:48px;flex-wrap:wrap;opacity:0;animation:fadeUp .8s 3.4s forwards;}




/* reveal on scroll */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1);}
.reveal.in{opacity:1;transform:translateY(0);}

/* STATEMENT */
.statement{text-align:center;}
.statement h2{font-weight:900;font-size:clamp(38px,7vw,96px);line-height:1.02;text-transform:uppercase;letter-spacing:-1px;}
.statement .grey-line{color:var(--grey);}
.statement p.sub{margin-top:28px;color:var(--red);font-size:13px;letter-spacing:3px;}
.statement p.small{margin-top:18px;color:var(--grey);font-size:14px;}

/* COUNTDOWN */
.countdown-section{text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(204,0,0,.09),transparent 60%);}
.count-label{font-size:12px;letter-spacing:5px;color:var(--grey);margin-bottom:36px;}
.timer{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;}
.tblock{border:1px solid #1c1c1c;padding:26px 22px;min-width:110px;border-radius:3px;background:#080808;position:relative;}
.tblock.tick::after{content:"";position:absolute;inset:0;border-radius:3px;box-shadow:0 0 22px rgba(204,0,0,.35);opacity:0;animation:tickGlow .5s ease;}
@keyframes tickGlow{0%{opacity:1;}100%{opacity:0;}}
.tnum{font-size:clamp(38px,6vw,72px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;}
.tlabel{margin-top:10px;font-size:11px;letter-spacing:3px;color:var(--grey);}
.count-foot{margin-top:34px;color:var(--grey);font-size:14px;}
@media(max-width:640px){.timer{gap:12px;}.tblock{min-width:42%;padding:20px 10px;}}


/* FOOTER */
footer{padding:70px 6vw;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));border-top:1px solid #161616;display:flex;flex-wrap:wrap;justify-content:space-between;gap:30px;}
.f-brand{font-weight:900;letter-spacing:2px;font-size:16px;}
.f-tag{color:var(--grey);font-size:12px;margin-top:0px;margin-left: 180px;letter-spacing:1px;}
.f-links{display:flex;gap:20px;flex-wrap:wrap;color:var(--grey);font-size:12px;letter-spacing:1px;}
.f-links a{color:var(--grey);text-decoration:none;}
.f-links a:hover{color:#fff;}
.f-copy{width:100%;color:#444;font-size:11px;margin-top:30px;letter-spacing:1px;}
</style>
</head>

<script>
// loader
window.addEventListener('load',()=>{
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),2300);
});

// countdown — change target date here
const target = new Date();
target.setDate(target.getDate()+129);
target.setHours(target.getHours()+07, target.getMinutes()+15, target.getSeconds()+17);

function pad(n){return String(n).padStart(2,'0');}
let prev={};
function tick(){
  const now=new Date();
  let diff=target-now;
  const foot=document.getElementById('countFoot');
  if(diff<=0){
    document.getElementById('timer').innerHTML='<div class="tblock" style="min-width:280px"><div class="tnum">WE ARE LIVE.</div></div>';
    foot.innerHTML='<a href="#" class="btn btn-primary" style="margin-top:20px;display:inline-flex">Enter Pro Ultimate Global</a>';
    clearInterval(timerInt);
    return;
  }
  const d=Math.floor(diff/86400000);
  const h=Math.floor(diff/3600000)%24;
  const m=Math.floor(diff/60000)%60;
  const s=Math.floor(diff/1000)%60;
  const vals={d,h:pad(h),m:pad(m),s:pad(s)};
  ['d','h','m','s'].forEach(k=>{
    const el=document.getElementById(k);
    if(el && prev[k]!==vals[k]){
      el.textContent=vals[k];
      el.parentElement.classList.remove('tick');
      void el.offsetWidth;
      el.parentElement.classList.add('tick');
      prev[k]=vals[k];
    }
  });
}
tick();
const timerInt=setInterval(tick,1000);

// scroll reveal
const io=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); });
},{threshold:.2});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

// map tooltip
const tip=document.getElementById('tip');
const tipName=document.getElementById('tipName');
document.querySelectorAll('.node').forEach(node=>{
  node.addEventListener('click',(e)=>{
    e.stopPropagation();
    const svg=node.closest('svg');
    const rect=svg.getBoundingClientRect();
    const x=parseFloat(node.dataset.x)/800*rect.width;
    const y=parseFloat(node.dataset.y)/420*rect.height;
    tip.style.left=x+'px';
    tip.style.top=y+'px';
    tipName.textContent=node.dataset.name;
    tip.classList.add('show');
  });
});
document.addEventListener('click',()=>tip.classList.remove('show'));

// email form
document.getElementById('emailForm').addEventListener('submit',function(e){
  e.preventDefault();
  document.getElementById('success').classList.add('show');
  this.reset();
});
</script>
